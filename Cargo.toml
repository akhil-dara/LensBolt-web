[package]
name = "lensbolt-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/akhil-dara/lensbolt-web"
description = "LensBolt sender for the browser (WebAssembly bindings over lensbolt-core)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lensbolt-core = { git = "https://github.com/akhil-dara/lensbolt-core", tag = "v0.1.4", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
# speed, not size: on the real Full HD 2 px phone captures one reader in node went 32-36 ms -> 24-25 ms per frame
# (2026-11-02, simd128, lto), and with lto the module came out smaller too (1189 -> 1027 KB)
opt-level = 3
lto = true
codegen-units = 1
